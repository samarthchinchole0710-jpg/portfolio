<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Publishing QA Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#111820;
  --panel:#182230;
  --panel-2:#1e2a3a;
  --border:#2b3948;
  --text:#e7edf3;
  --text-dim:#8fa1b3;
  --yes:#3ecf8e;
  --yes-bg:rgba(62,207,142,.12);
  --no:#e8615a;
  --no-bg:rgba(232,97,90,.12);
  --na:#e0a458;
  --na-bg:rgba(224,164,88,.12);
  --accent:#5bb8d4;
  --font-display:'Space Grotesk', 'Arial Narrow', sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  padding:28px 20px 80px;
}
.wrap{max-width:920px;margin:0 auto;}

/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.title{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:.2px;margin:0;}
.subtitle{color:var(--text-dim);font-size:13px;margin-top:4px;font-family:var(--font-mono);letter-spacing:.3px;}
.ring-wrap{display:flex;align-items:center;gap:12px;}
.ring{position:relative;width:64px;height:64px;}
.ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:6;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;font-weight:600;}
.ring-caption{font-size:11px;color:var(--text-dim);line-height:1.4;}
.ring-caption b{color:var(--text);}

/* Toolbar */
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:20px;
}
select, button{
  font-family:var(--font-body);font-size:13px;
  background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:7px;padding:8px 12px;cursor:pointer;
}
select:focus, button:focus, .pill:focus{outline:2px solid var(--accent);outline-offset:1px;}
button.primary{background:var(--accent);color:#0d1620;border-color:var(--accent);font-weight:600;}
button.primary:hover{filter:brightness(1.08);}
button:hover{border-color:var(--accent);}
.chip-group{display:flex;gap:6px;}
.chip{
  font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;background:transparent;
}
.chip.active{background:var(--accent);color:#0d1620;border-color:var(--accent);font-weight:600;}
.spacer{flex:1;}
.save-note{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);}

/* Project bar */
.project-bar{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-bottom:16px;
}
.project-bar-top{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.project-bar-top label{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.project-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.project-fields input{
  background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:13px;padding:8px 10px;font-family:var(--font-body);width:100%;
}
.project-fields input::placeholder{color:var(--text-dim);}
.task-filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.task-filter-row label{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-right:4px;}
.task-chip{
  font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);
  color:var(--text-dim);cursor:pointer;background:transparent;
}
.task-chip.on{background:var(--accent);color:#0d1620;border-color:var(--accent);font-weight:600;}
@media(max-width:700px){.project-fields{grid-template-columns:repeat(2,1fr);}}

/* Group card */
.group{
  position:relative;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:20px 20px 14px;margin-bottom:18px;overflow:hidden;
}
.group-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.group-name{font-family:var(--font-display);font-weight:700;font-size:18px;}
.group-progress-track{height:5px;background:var(--border);border-radius:4px;overflow:hidden;margin:10px 0 4px;}
.group-progress-fill{height:100%;background:var(--accent);transition:width .3s ease;}
.group-stats{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:10px;}

.stamp{
  position:absolute;top:14px;right:-6px;transform:rotate(-9deg);
  font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:1.5px;
  padding:5px 14px;border:2.5px solid; border-radius:5px; opacity:.92;
}
.stamp.cleared{color:var(--yes);border-color:var(--yes);background:var(--yes-bg);}
.stamp.flagged{color:var(--no);border-color:var(--no);background:var(--no-bg);}
.stamp.progress{color:var(--na);border-color:var(--na);background:var(--na-bg);}

.subcat{
  font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-dim);margin:14px 0 6px;padding-top:8px;border-top:1px dashed var(--border);
}
.subcat:first-of-type{border-top:none;padding-top:0;}

.item{padding:10px 0;border-bottom:1px solid var(--border);}
.item:last-child{border-bottom:none;}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:14px;}
.item-name{font-weight:600;font-size:14px;}
.item-desc{color:var(--text-dim);font-size:12.5px;margin-top:3px;line-height:1.45;max-width:600px;}
.pills{display:flex;gap:5px;flex-shrink:0;}
.pill{
  font-family:var(--font-mono);font-size:11px;font-weight:600;padding:5px 10px;
  border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;
}
.pill[data-v="YES"].on{background:var(--yes-bg);color:var(--yes);border-color:var(--yes);}
.pill[data-v="NO"].on{background:var(--no-bg);color:var(--no);border-color:var(--no);}
.pill[data-v="NA"].on{background:var(--na-bg);color:var(--na);border-color:var(--na);}
.note-input{
  margin-top:7px;width:100%;background:var(--panel-2);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:12px;padding:6px 9px;font-family:var(--font-body);
  display:none;
}
.note-input.show{display:block;}

.footer-summary{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;display:flex;gap:26px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12.5px;
}
.footer-summary div b{display:block;font-size:20px;font-family:var(--font-display);margin-bottom:2px;}
.hidden{display:none !important;}
::selection{background:var(--accent);color:#0d1620;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <p class="title">Publishing QA Checklist</p>
      <p class="subtitle">CISCO LOCALIZATION PIPELINE — SOURCE DOWNLOAD / RENDITION / PUBLISH</p>
    </div>
    <div class="ring-wrap">
      <div class="ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="27"/>
          <circle id="ringFg" class="ring-fg" cx="32" cy="32" r="27" stroke-dasharray="170" stroke-dashoffset="170"/>
        </svg>
        <div class="ring-label" id="ringLabel">0%</div>
      </div>
      <div class="ring-caption">Overall complete<br><b id="capStats">0 / 0 items</b></div>
    </div>
  </div>

  <div class="project-bar">
    <div class="project-bar-top">
      <label>Project</label>
      <select id="projectSelect" style="min-width:200px;"></select>
      <button id="newProjectBtn">+ New project</button>
      <div class="spacer"></div>
      <span class="save-note" id="saveNote">not yet saved</span>
    </div>
    <div class="project-fields">
      <input id="pfName" placeholder="Project name / ID">
      <input id="pfClient" placeholder="Client / Requestor">
      <input id="pfDate" type="date">
      <input id="pfPrepared" placeholder="Prepared by">
    </div>
    <div class="task-filter-row" id="taskFilterRow">
      <label>Include tasks:</label>
    </div>
  </div>

  <div class="toolbar">
    <select id="sortSel">
      <option value="group">Sort: Task order</option>
      <option value="completion">Sort: Least complete first</option>
      <option value="flagged">Sort: Flagged first</option>
    </select>
    <div class="chip-group">
      <button class="chip active" data-f="all">All</button>
      <button class="chip" data-f="pending">Pending</button>
      <button class="chip" data-f="flagged">Flagged</button>
    </div>
    <div class="spacer"></div>
    <button id="resetBtn">Reset</button>
    <button id="excelBtn">Export Excel</button>
    <button class="primary" id="emailBtn">Email report</button>
  </div>

  <div id="groups"></div>

  <div class="footer-summary" id="footerSummary"></div>

</div>

<script>
const DATA = [
  {id:"g1", name:"Ask Author track", subs:[
    {cat:"General", items:[
      {i:"issue description check", d:"For all issues, the ticket description is clear and concise, enabling Author, PM and Doris to quickly understand the problem."},
      {i:"issue tracking check", d:"For all issues, directly or indirectly indicate in the ticket that the issue originates from the AEM system or the Author."},
      {i:"TAT check", d:"For all issues, require technical writers to estimate the turnaround time."},
      {i:"weekly push", d:"For all issues, check the status and TAT every week if we cannot get a correct result."}
    ]}
  ]},
  {id:"g2", name:"Ticket track", subs:[
    {cat:"General", items:[
      {i:"issue description check", d:"For all issues, the ticket description is clear and concise, enabling IT, PM and Doris to quickly understand the problem."},
      {i:"issue tracking check", d:"For uncommon issues, directly or indirectly indicate in the ticket that the issue originates from the AEM system or the Author."},
      {i:"TAT check", d:"For all issues, require the IT engineer to estimate the turnaround time."},
      {i:"weekly push", d:"For all issues, push IT by case if we cannot get a correct result within 1 week."},
      {i:"pending summary", d:"Share status with the team lead. For all issues, push IT and ask for TAT."},
      {i:"result check & push", d:"Share result with the team lead; if the issue reproduces, ask for the next TAT."}
    ]}
  ]},
  {id:"g3", name:"1st rendition / Web up checklist", subs:[
    {cat:"URL", items:[
      {i:"source check", d:"For all links, confirm we have all settings and files needed for the publish task."},
      {i:"Content check", d:"For all links, all text should be localized (per client request), with no obvious style issues."},
      {i:"HTML check", d:"For Global links, rendition the HTML page and open a case to avoid delay (followed up with the publish engineer)."},
      {i:"image upload check", d:"For Global links, use correct images to rendition HTML and PDF files ASAP."},
      {i:"access level check", d:"For CF links, take a screenshot of the access level for double confirmation."}
    ]}
  ]},
  {id:"g4", name:"Publish checklist", subs:[
    {cat:"URL", items:[
      {i:"source check", d:"For all links, confirm we have all settings and files needed for the publish task."},
      {i:"URL rule check", d:"For Global tasks, we have 2 rules for publish task — confirm the file is correct."},
      {i:"Refresh (Cache) check", d:"For all links, run CDC Bot to refresh before delivery and clear cache to see the real result."},
      {i:"Date check", d:"For all links, check both HTML and PDF publish dates to avoid cache issues."},
      {i:"Content check", d:"For all links, all text should be localized (per client request), with no obvious style issues."},
      {i:"access level check", d:"For CF links, take a screenshot of the access level for double confirmation."},
      {i:"images check", d:"For Global links, all images should be localized and correctly shown."},
      {i:"listing page check", d:"For JP and Global links, generate the listing page for every link."},
      {i:"Mastersheet check", d:"For JP links, target URL, Engineer, status and publish date must be filled correctly."},
      {i:"RCSI check", d:"For all files, follow the RCSI rules."}
    ]},
    {cat:"Workflow", items:[
      {i:"Junction check", d:"Junction task submitted on time."},
      {i:"pending issue report", d:"Keep everything consistent with source; report any unresolved issues to the PM via email."},
      {i:"DTP update screenshot check", d:"If DTP assistance is required, screenshots must be provided."}
    ]}
  ]},
  {id:"g5", name:"SD checklist", subs:[
    {cat:"Mastersheet", items:[
      {i:"Duplicate check", d:"Remove duplicate SIDs and report to the PM team."},
      {i:"scope: redirect", d:"If the file is redirected, report it promptly."},
      {i:"mastersheet", d:"Mastersheet should be updated during the SD phase."}
    ]},
    {cat:"Source", items:[
      {i:"source check", d:"Compare source or ask the author during the SD phase to confirm we have all settings for the publish task."},
      {i:"fully compared", d:"The source file for translation must be consistent with the online content on Cisco.com."},
      {i:"PDF rendition successful", d:"All XML-type files need to be tested for PDF rendition."},
      {i:"HTML rendition successful", d:"All XML-type files need to be tested for HTML rendition."},
      {i:"title & description", d:"In CF tasks, title and description should be saved manually."},
      {i:"Madcap check", d:"All Madcap files need a password check."},
      {i:"RCSI check", d:"For all files, follow the RCSI rules."}
    ]},
    {cat:"Workflow", items:[
      {i:"Zip structure check", d:"SID should be saved in XML-type files."},
      {i:"reference check", d:"PDF should be saved in a special folder for translator reference."},
      {i:"Sharefile content check", d:"No extra files saved in the SD folder."},
      {i:"XML file number check", d:"Reasonable quantity of XML files."}
    ]}
  ]}
];

// flatten with stable ids
DATA.forEach(g=>{ g.subs.forEach(s=>{ s.items.forEach((it,idx)=>{ it.id = g.id+"-"+s.cat.replace(/\s+/g,'')+"-"+idx; }); }); });

let responses = {};   // id -> {status:'YES'|'NO'|'NA', note:''}
let sortMode = 'group';
let filterMode = 'all';
let projectMeta = {name:'', client:'', date:'', preparedBy:''};
let selectedGroups = new Set(DATA.map(g=>g.id));
let currentProjectId = null;
const INDEX_KEY = 'qa-projects-index';

function activeGroups(){
  return DATA.filter(g=>selectedGroups.has(g.id));
}

function slugify(s){
  return (s||'untitled').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'untitled';
}

async function getIndex(){
  try{
    const r = await window.storage.get(INDEX_KEY, false);
    return r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function setIndex(list){
  try{ await window.storage.set(INDEX_KEY, JSON.stringify(list), false); }catch(e){}
}

async function populateProjectDropdown(selectId){
  const list = await getIndex();
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = '<option value="">— unsaved / new —</option>' +
    list.map(p=>`<option value="${p.id}">${p.name || p.id}</option>`).join('');
  sel.value = selectId || '';
}

async function loadProject(id){
  if(!id){
    currentProjectId = null;
    projectMeta = {name:'', client:'', date:'', preparedBy:''};
    responses = {};
    selectedGroups = new Set(DATA.map(g=>g.id));
    document.getElementById('saveNote').textContent = 'not yet saved';
  } else {
    try{
      const r = await window.storage.get('qa-project-'+id, false);
      const parsed = JSON.parse(r.value);
      currentProjectId = id;
      projectMeta = parsed.meta || {name:'', client:'', date:'', preparedBy:''};
      responses = parsed.responses || {};
      selectedGroups = new Set(parsed.selectedGroups && parsed.selectedGroups.length ? parsed.selectedGroups : DATA.map(g=>g.id));
      document.getElementById('saveNote').textContent = 'last saved ' + new Date(parsed.savedAt).toLocaleString();
    }catch(e){
      document.getElementById('saveNote').textContent = 'could not load project';
    }
  }
  document.getElementById('pfName').value = projectMeta.name || '';
  document.getElementById('pfClient').value = projectMeta.client || '';
  document.getElementById('pfDate').value = projectMeta.date || '';
  document.getElementById('pfPrepared').value = projectMeta.preparedBy || '';
  renderTaskFilter();
  render();
}

async function saveState(){
  if(!currentProjectId){
    if(!projectMeta.name){ document.getElementById('saveNote').textContent = 'add a project name to save'; return; }
    currentProjectId = slugify(projectMeta.name) + '-' + Date.now().toString(36);
    const list = await getIndex();
    list.push({id: currentProjectId, name: projectMeta.name});
    await setIndex(list);
    await populateProjectDropdown(currentProjectId);
  } else {
    const list = await getIndex();
    const entry = list.find(p=>p.id===currentProjectId);
    if(entry && entry.name !== projectMeta.name){
      entry.name = projectMeta.name;
      await setIndex(list);
      await populateProjectDropdown(currentProjectId);
    }
  }
  try{
    await window.storage.set('qa-project-'+currentProjectId, JSON.stringify({
      meta: projectMeta, responses, selectedGroups:[...selectedGroups], savedAt: Date.now()
    }), false);
    document.getElementById('saveNote').textContent = 'saved ' + new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('saveNote').textContent = 'save failed — check connection';
  }
}

function renderTaskFilter(){
  const row = document.getElementById('taskFilterRow');
  row.innerHTML = '<label>Include tasks:</label>' + DATA.map(g=>
    `<button class="task-chip ${selectedGroups.has(g.id)?'on':''}" onclick="toggleGroup('${g.id}')">${g.name}</button>`
  ).join('');
}
function toggleGroup(id){
  if(selectedGroups.has(id)){
    if(selectedGroups.size>1) selectedGroups.delete(id);
  } else {
    selectedGroups.add(id);
  }
  renderTaskFilter();
  render();
  saveState();
}

function setStatus(id, val){
  const cur = responses[id] || {status:'', note:''};
  cur.status = (cur.status === val) ? '' : val;
  responses[id] = cur;
  render();
  saveState();
}
function setNote(id, val){
  const cur = responses[id] || {status:'', note:''};
  cur.note = val;
  responses[id] = cur;
  saveState();
}

function groupStats(g){
  let total=0, done=0, flagged=0;
  g.subs.forEach(s=>s.items.forEach(it=>{
    total++;
    const r = responses[it.id];
    if(r && r.status) done++;
    if(r && r.status === 'NO') flagged++;
  }));
  return {total, done, flagged};
}

function overallStats(){
  let total=0, done=0, flagged=0;
  activeGroups().forEach(g=>{
    const s = groupStats(g);
    total+=s.total; done+=s.done; flagged+=s.flagged;
  });
  return {total, done, flagged};
}

function sortedGroups(){
  const arr = [...activeGroups()];
  if(sortMode==='completion') arr.sort((a,b)=>{
    const sa=groupStats(a), sb=groupStats(b);
    return (sa.done/sa.total) - (sb.done/sb.total);
  });
  else if(sortMode==='flagged') arr.sort((a,b)=> groupStats(b).flagged - groupStats(a).flagged);
  return arr;
}

function itemVisible(id){
  const r = responses[id];
  if(filterMode==='all') return true;
  if(filterMode==='pending') return !(r && r.status);
  if(filterMode==='flagged') return r && r.status==='NO';
  return true;
}

function render(){
  const container = document.getElementById('groups');
  container.innerHTML = '';
  sortedGroups().forEach(g=>{
    const stats = groupStats(g);
    const pct = stats.total ? Math.round(100*stats.done/stats.total) : 0;
    const card = document.createElement('div');
    card.className = 'group';

    let stampHtml = '';
    if(stats.flagged>0) stampHtml = '<div class="stamp flagged">FLAGGED</div>';
    else if(stats.done===stats.total && stats.total>0) stampHtml = '<div class="stamp cleared">CLEARED</div>';
    else stampHtml = '<div class="stamp progress">IN PROGRESS</div>';

    let subsHtml = '';
    g.subs.forEach(s=>{
      const visibleItems = s.items.filter(it=>itemVisible(it.id));
      if(visibleItems.length===0) return;
      subsHtml += `<div class="subcat">${s.cat}</div>`;
      visibleItems.forEach(it=>{
        const r = responses[it.id] || {status:'',note:''};
        subsHtml += `
          <div class="item">
            <div class="item-top">
              <div>
                <div class="item-name">${it.i}</div>
                <div class="item-desc">${it.d}</div>
              </div>
              <div class="pills">
                <button class="pill ${r.status==='YES'?'on':''}" data-v="YES" onclick="setStatus('${it.id}','YES')">YES</button>
                <button class="pill ${r.status==='NO'?'on':''}" data-v="NO" onclick="setStatus('${it.id}','NO')">NO</button>
                <button class="pill ${r.status==='NA'?'on':''}" data-v="NA" onclick="setStatus('${it.id}','NA')">N/A</button>
              </div>
            </div>
            <input class="note-input ${r.status==='NO'?'show':''}" placeholder="Note — why flagged / follow-up action" value="${(r.note||'').replace(/"/g,'&quot;')}" oninput="setNote('${it.id}', this.value)">
          </div>`;
      });
    });

    if(subsHtml===''){ return; } // nothing visible under current filter

    card.innerHTML = `
      ${stampHtml}
      <div class="group-head">
        <div>
          <div class="group-name">${g.name}</div>
        </div>
      </div>
      <div class="group-progress-track"><div class="group-progress-fill" style="width:${pct}%"></div></div>
      <div class="group-stats">${stats.done}/${stats.total} answered · ${stats.flagged} flagged</div>
      ${subsHtml}
    `;
    container.appendChild(card);
  });

  const o = overallStats();
  const opct = o.total ? Math.round(100*o.done/o.total) : 0;
  const circumference = 170;
  document.getElementById('ringFg').setAttribute('stroke-dashoffset', circumference - (circumference*opct/100));
  document.getElementById('ringLabel').textContent = opct+'%';
  document.getElementById('capStats').textContent = o.done+' / '+o.total+' items';

  document.getElementById('footerSummary').innerHTML = `
    <div><b>${o.total}</b>Total checklist items</div>
    <div><b>${o.done}</b>Answered</div>
    <div><b>${o.total-o.done}</b>Pending</div>
    <div><b style="color:var(--no)">${o.flagged}</b>Flagged (NO)</div>
  `;
}

document.getElementById('sortSel').addEventListener('change', e=>{ sortMode = e.target.value; render(); });
document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    filterMode = c.dataset.f;
    render();
  });
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Clear all responses and notes? This cannot be undone.')){
    responses = {};
    render();
    saveState();
  }
});

document.getElementById('emailBtn').addEventListener('click', ()=>{
  const o = overallStats();
  const opct = o.total ? Math.round(100*o.done/o.total) : 0;
  let body = `QA Checklist Report — ${new Date().toLocaleDateString()}\n`;
  body += `Project: ${projectMeta.name||'(unnamed)'}\n`;
  if(projectMeta.client) body += `Client: ${projectMeta.client}\n`;
  if(projectMeta.date) body += `Date: ${projectMeta.date}\n`;
  if(projectMeta.preparedBy) body += `Prepared by: ${projectMeta.preparedBy}\n`;
  body += `\nOverall: ${o.done}/${o.total} items answered (${opct}%), ${o.flagged} flagged as NO\n\n`;
  body += `Per section:\n`;
  activeGroups().forEach(g=>{
    const s = groupStats(g);
    const p = s.total ? Math.round(100*s.done/s.total) : 0;
    body += `- ${g.name}: ${s.done}/${s.total} complete (${p}%), ${s.flagged} flagged\n`;
  });

  const flaggedLines = [];
  activeGroups().forEach(g=>{
    g.subs.forEach(s=>{
      s.items.forEach(it=>{
        const r = responses[it.id];
        if(r && r.status==='NO'){
          flaggedLines.push(`• [${g.name}] ${it.i}${r.note ? ' — '+r.note : ''}`);
        }
      });
    });
  });
  if(flaggedLines.length){
    body += `\nFlagged items requiring attention:\n` + flaggedLines.slice(0,25).join('\n');
    if(flaggedLines.length>25) body += `\n…and ${flaggedLines.length-25} more (see checklist tool for full list)`;
  } else {
    body += `\nNo items currently flagged.`;
  }

  const subject = `Publishing QA Checklist Report — ${projectMeta.name||''} — ${new Date().toLocaleDateString()}`;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});

document.getElementById('excelBtn').addEventListener('click', ()=>{
  const rows = [
    ["Project", projectMeta.name||''],
    ["Client", projectMeta.client||''],
    ["Date", projectMeta.date||''],
    ["Prepared by", projectMeta.preparedBy||''],
    [],
    ["Task Group","Catalogue","Item","Description","Status","Note"]
  ];
  activeGroups().forEach(g=>{
    g.subs.forEach(s=>{
      s.items.forEach(it=>{
        const r = responses[it.id] || {status:'',note:''};
        rows.push([g.name, s.cat, it.i, it.d, r.status||'', r.note||'']);
      });
    });
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:26},{wch:14},{wch:26},{wch:60},{wch:9},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws, "Checklist");

  const o = overallStats();
  const opct = o.total ? Math.round(100*o.done/o.total) : 0;
  const summaryRows = [
    ["QA Checklist Report", new Date().toLocaleString()],
    ["Project", projectMeta.name||''],
    ["Client", projectMeta.client||''],
    [],
    ["Overall complete", `${o.done}/${o.total} (${opct}%)`],
    ["Flagged (NO)", o.flagged],
    [],
    ["Section","Complete","Flagged"]
  ];
  activeGroups().forEach(g=>{
    const s = groupStats(g);
    const p = s.total ? Math.round(100*s.done/s.total) : 0;
    summaryRows.push([g.name, `${s.done}/${s.total} (${p}%)`, s.flagged]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(summaryRows);
  ws2['!cols'] = [{wch:32},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, "Summary");

  const fname = `QA-Checklist-${slugify(projectMeta.name||'report')}-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
});

['pfName','pfClient','pfDate','pfPrepared'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{
    projectMeta = {
      name: document.getElementById('pfName').value.trim(),
      client: document.getElementById('pfClient').value.trim(),
      date: document.getElementById('pfDate').value,
      preparedBy: document.getElementById('pfPrepared').value.trim()
    };
    saveState();
  });
});

document.getElementById('projectSelect').addEventListener('change', e=>{
  loadProject(e.target.value || null);
});

document.getElementById('newProjectBtn').addEventListener('click', async ()=>{
  await loadProject(null);
  document.getElementById('projectSelect').value = '';
  document.getElementById('pfName').focus();
});

(async function init(){
  await populateProjectDropdown(null);
  await loadProject(null);
})();

</script>
</body>
</html>
